<svg xmlns="http://w3.org" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background App Badge -->
  <rect x="8" y="8" width="240" height="240" rx="32" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4" />

  <!-- Subtle Map Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1.5" fill="none">
    <line x1="8" y1="88" x2="248" y2="88" />
    <line x1="8" y1="168" x2="248" y2="168" />
    <line x1="88" y1="8" x2="88" y2="248" />
    <line x1="168" y1="8" x2="168" y2="248" />
    <path d="M 8 52 Q 80 36, 136 68 T 248 44" />
    <path d="M 8 204 Q 100 220, 160 188 T 248 212" />
  </g>

  <!-- 3x3 Tasking Manager Grid Squares -->
  <g stroke="#0F172A" stroke-width="5" stroke-linejoin="round">
    <!-- Row 1 -->
    <!-- Ready to map (White) -->
    <rect x="28" y="28" width="60" height="60" rx="8" fill="#FFFFFF" />
    <!-- Ready to validate (Blue) -->
    <rect x="98" y="28" width="60" height="60" rx="8" fill="#0284C7" />
    <!-- Validated (Green) -->
    <rect x="168" y="28" width="60" height="60" rx="8" fill="#10B981" />

    <!-- Row 2 -->
    <!-- Validated (Green) -->
    <rect x="28" y="98" width="60" height="60" rx="8" fill="#10B981" />
    <!-- Locked square background (White) -->
    <rect x="98" y="98" width="60" height="60" rx="8" fill="#FFFFFF" />
    <!-- Ready to map (White) -->
    <rect x="168" y="98" width="60" height="60" rx="8" fill="#FFFFFF" />

    <!-- Row 3 -->
    <!-- Ready to validate (Blue) -->
    <rect x="28" y="168" width="60" height="60" rx="8" fill="#0284C7" />
    <!-- Invalidated (Yellow) -->
    <rect x="98" y="168" width="60" height="60" rx="8" fill="#FACC15" />
    <!-- Validated (Green) -->
    <rect x="168" y="168" width="60" height="60" rx="8" fill="#10B981" />
  </g>

  <!-- Center Padlock Icon (Locked by another user) -->
  <g fill="#0F172A">
    <!-- Padlock Shackle -->
    <path d="M 119 124 V 118 A 9 9 0 0 1 137 118 V 124" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
    <!-- Padlock Body -->
    <rect x="114" y="123" width="28" height="22" rx="4" />
    <!-- Keyhole -->
    <circle cx="128" cy="131" r="2.5" fill="#FFFFFF" />
    <path d="M 126.8 132 L 126.2 138 H 129.8 L 129.2 132 Z" fill="#FFFFFF" />
  </g>
</svg>
