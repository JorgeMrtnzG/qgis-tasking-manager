<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Tasking Manager</title>
  <desc>An area of interest outlined on a map, subdivided into colour-coded task squares.</desc>

  <defs>
    <clipPath id="aoi-clip">
      <path d="M 58 34 L 164 24 L 228 86 L 214 158 L 176 226 L 86 218 L 30 158 L 36 74 Z" />
    </clipPath>
  </defs>

  <!-- App badge -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" />

  <!-- Area of interest fill -->
  <path d="M 58 34 L 164 24 L 228 86 L 214 158 L 176 226 L 86 218 L 30 158 L 36 74 Z" fill="#EAF1F7" />

  <!-- Task grid, clipped by the area of interest -->
  <g clip-path="url(#aoi-clip)" stroke="#334155" stroke-width="3" stroke-linejoin="round">
    <!-- Row 1 -->
    <rect x="24" y="24" width="52" height="52" fill="#FFFFFF" />
    <rect x="76" y="24" width="52" height="52" fill="#40AC8C" />
    <rect x="128" y="24" width="52" height="52" fill="#ADE6EF" />
    <rect x="180" y="24" width="52" height="52" fill="#FFFFFF" />
    <!-- Row 2 -->
    <rect x="24" y="76" width="52" height="52" fill="#ADE6EF" />
    <rect x="76" y="76" width="52" height="52" fill="#FCECA4" />
    <rect x="128" y="76" width="52" height="52" fill="#40AC8C" />
    <rect x="180" y="76" width="52" height="52" fill="#FFFFFF" />
    <!-- Row 3 -->
    <rect x="24" y="128" width="52" height="52" fill="#FFFFFF" />
    <rect x="76" y="128" width="52" height="52" fill="#FFFFFF" />
    <rect x="128" y="128" width="52" height="52" fill="#FCECA4" />
    <rect x="180" y="128" width="52" height="52" fill="#40AC8C" />
    <!-- Row 4 -->
    <rect x="24" y="180" width="52" height="52" fill="#40AC8C" />
    <rect x="76" y="180" width="52" height="52" fill="#ADE6EF" />
    <rect x="128" y="180" width="52" height="52" fill="#D8DAE4" />
    <rect x="180" y="180" width="52" height="52" fill="#ADE6EF" />
  </g>

  <!-- Area of interest boundary: light halo, then strong outline -->
  <path d="M 58 34 L 164 24 L 228 86 L 214 158 L 176 226 L 86 218 L 30 158 L 36 74 Z"
        fill="none" stroke="#F8FAFC" stroke-width="13" stroke-linejoin="round" />
  <path d="M 58 34 L 164 24 L 228 86 L 214 158 L 176 226 L 86 218 L 30 158 L 36 74 Z"
        fill="none" stroke="#0F172A" stroke-width="7" stroke-linejoin="round" />
</svg>
